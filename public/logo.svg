<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <rect width="500" height="500" fill="#09090b" rx="28"/>
  <defs>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF334B"/>
      <stop offset="100%" stop-color="#D91630"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#FF1E38" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Upper left star -->
  <polygon points="160,180 166,198 184,198 170,209 175,227 160,216 145,227 150,209 136,198 154,198" fill="#FF2B44"/>

  <!-- Lower right star -->
  <polygon points="370,300 376,318 394,318 380,329 385,347 370,336 355,347 360,329 346,318 364,318" fill="#FF2B44"/>

  <!-- Stylized J & K Monogram -->
  <g filter="url(#glow)">
    <!-- J bar and hook -->
    <path d="M 240,140 L 295,140 L 205,355 C 190,362 165,364 125,362 C 115,355 125,310 135,295 C 155,295 165,295 175,290 Z" fill="url(#redGrad)" opacity="0.95"/>
    
    <!-- K Stem -->
    <path d="M 240,140 L 295,140 L 210,355 L 155,355 Z" fill="url(#redGrad)"/>

    <!-- K Top Arm (Swoosh) -->
    <path d="M 265,210 C 290,195 330,165 410,140 L 375,185 C 320,205 285,225 260,245 Z" fill="url(#redGrad)"/>

    <!-- K Bottom Leg (Thick dynamic leg) -->
    <path d="M 252,240 C 280,270 300,310 365,355 L 290,355 C 255,320 240,285 235,260 Z" fill="url(#redGrad)"/>
    
    <!-- Center connecting notch -->
    <rect x="220" y="195" width="45" height="12" fill="url(#redGrad)" transform="skewX(-20)"/>
  </g>
</svg>
